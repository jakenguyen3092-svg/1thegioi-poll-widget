<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mẫu bình chọn</title>
  <style>
    :root {
      --brand: #00a779;
      --brand-dark: #008661;
      --brand-soft: #effaf6;
      --ink: #202428;
      --muted: #697177;
      --line: #dfe5e7;
      --surface: #fff;
      --track: #e8eeec;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poll {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 20px 22px 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--brand);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--brand); }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(20px, 4vw, 25px);
      line-height: 1.32;
    }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 9px 0;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 3px;
      cursor: pointer;
      line-height: 1.4;
      transition: border-color .15s, background .15s;
    }
    .choice:hover, .choice:has(input:focus-visible), .choice:has(input:checked) {
      border-color: var(--brand);
      background: var(--brand-soft);
    }
    .choice input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--brand); }
    .actions { display: flex; align-items: center; margin-top: 17px; }
    button {
      border: 0;
      border-radius: 3px;
      padding: 10px 22px;
      color: #fff;
      background: var(--brand);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .message { min-height: 19px; margin: 10px 0 0; color: #c23934; font-size: 13px; }
    .results h2 { margin: 0 0 5px; font-size: 18px; }
    .thanks { margin: 0 0 18px; color: var(--brand-dark); font-size: 13px; }
    .result { margin: 0 0 16px; }
    .result-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 14px; }
    .result-head strong { white-space: nowrap; color: var(--brand); }
    .track { height: 9px; overflow: hidden; background: var(--track); }
    .bar { height: 100%; background: var(--brand); transition: width .45s ease; }
    .total { margin: 5px 0 0; color: var(--muted); font-size: 12px; text-align: right; }

    @media (max-width: 480px) {
      .poll { padding: 17px 15px 19px; }
      .result-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="poll" aria-labelledby="poll-title">
    <p class="eyebrow">Thăm dò ý kiến</p>
    <h1 id="poll-title">Theo bạn, bán 100 ly cà phê mỗi ngày có khả thi?</h1>

    <form id="poll-form">
      <fieldset>
        <legend>Chọn một phương án</legend>
        <label class="choice"><input type="radio" name="answer" value="location"> <span>Khả thi, nếu vị trí đẹp</span></label>
        <label class="choice"><input type="radio" name="answer" value="cost"> <span>Không khả thi, chi phí phát sinh rất lớn</span></label>
        <label class="choice"><input type="radio" name="answer" value="model"> <span>Tùy thuộc vào mô hình kinh doanh</span></label>
      </fieldset>
      <div class="actions">
        <button id="vote-button" type="submit">Bình chọn</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <section id="poll-results" class="results" aria-labelledby="results-title" hidden>
      <h2 id="results-title">Kết quả bình chọn</h2>
      <p class="thanks">Cảm ơn bạn đã tham gia thăm dò ý kiến.</p>
      <div id="results-list"></div>
      <p id="total" class="total"></p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'demo-poll-coffee-v1';
    const options = [
      { id: 'location', label: 'Khả thi, nếu vị trí đẹp' },
      { id: 'cost', label: 'Không khả thi, chi phí phát sinh rất lớn' },
      { id: 'model', label: 'Tùy thuộc vào mô hình kinh doanh' }
    ];
    const form = document.querySelector('#poll-form');
    const message = document.querySelector('#message');
    const resultsList = document.querySelector('#results-list');
    const totalText = document.querySelector('#total');
    const voteButton = document.querySelector('#vote-button');
    const results = document.querySelector('#poll-results');

    function readVotes() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return options.reduce((votes, option) => {
          votes[option.id] = Number.isFinite(saved?.[option.id]) ? saved[option.id] : 0;
          return votes;
        }, {});
      } catch { return { location: 0, cost: 0, model: 0 }; }
    }

    function render() {
      const votes = readVotes();
      const total = Object.values(votes).reduce((sum, value) => sum + value, 0);
      resultsList.replaceChildren(...options.map((option) => {
        const count = votes[option.id];
        const percent = total ? Math.round(count / total * 100) : 0;
        const item = document.createElement('div');
        item.className = 'result';
        item.innerHTML = `<div class="result-head"><span>${option.label}</span><strong>${percent}% (${count})</strong></div><div class="track"><div class="bar" style="width:${percent}%"></div></div>`;
        return item;
      }));
      totalText.textContent = `Tổng số lượt bình chọn: ${total}`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const selected = form.elements.answer.value;
      if (!selected) {
        message.textContent = 'Vui lòng chọn một phương án trước khi bình chọn.';
        return;
      }
      const votes = readVotes();
      votes[selected] += 1;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
      render();
      form.hidden = true;
      results.hidden = false;
    });

    render();
  </script>
</body>
</html>

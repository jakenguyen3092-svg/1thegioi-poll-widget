<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1ThếGiới – Thăm dò ý kiến</title>
  <style>
    :root {
      --brand: #00a779;
      --brand-dark: #008661;
      --brand-soft: #effaf6;
      --ink: #202428;
      --muted: #697177;
      --line: #dfe5e7;
      --surface: #fff;
      --track: #e8eeec;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }
    .poll {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--brand);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--brand); }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(20px, 4vw, 25px);
      line-height: 1.32;
    }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 7px 0;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 3px;
      cursor: pointer;
      line-height: 1.4;
      transition: border-color .15s, background .15s;
    }
    .choice:hover, .choice:has(input:focus-visible), .choice:has(input:checked) {
      border-color: var(--brand);
      background: var(--brand-soft);
    }
    .choice input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--brand); }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
    button {
      border: 0;
      border-radius: 3px;
      padding: 10px 22px;
      color: #fff;
      background: var(--brand);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .button-secondary { color: var(--brand-dark); background: var(--brand-soft); }
    .button-secondary:hover { color: #fff; background: var(--brand-dark); }
    .message { min-height: 19px; margin: 10px 0 0; color: #c23934; font-size: 13px; }
    .results h2 { margin: 0 0 5px; font-size: 18px; }
    .thanks { margin: 0 0 18px; color: var(--brand-dark); font-size: 13px; }
    .result { margin: 0 0 16px; }
    .result-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 14px; }
    .result-head strong { white-space: nowrap; color: var(--brand); }
    .track { height: 9px; overflow: hidden; background: var(--track); }
    .bar { height: 100%; background: var(--brand); transition: width .45s ease; }
    .total { margin: 5px 0 0; color: var(--muted); font-size: 12px; text-align: right; }

    @media (max-width: 480px) {
      .poll { padding: 17px 15px 19px; }
      .result-head { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="poll" aria-labelledby="poll-title">
    <p class="eyebrow">1ThếGiới · Thăm dò ý kiến</p>
    <h1 id="poll-title">Theo bạn, đâu là giải pháp quan trọng nhất giúp Ukraine đối phó tốt hơn với tên lửa đạn đạo Nga?</h1>

    <form id="poll-form">
      <fieldset>
        <legend>Chọn một phương án</legend>
        <label class="choice"><input type="radio" name="answer" value="patriot-ammunition"> <span>Tăng mạnh nguồn đạn Patriot, đặc biệt PAC-3 MSE</span></label>
        <label class="choice"><input type="radio" name="answer" value="layered-air-defense"> <span>Xây mạng phòng không nhiều tầng, kết hợp Patriot, SAMP/T, IRIS-T, NASAMS và drone đánh chặn</span></label>
        <label class="choice"><input type="radio" name="answer" value="strike-launch-infrastructure"> <span>Tăng các đòn tập kích vào bệ phóng, kho đạn và cơ sở sản xuất tên lửa của Nga</span></label>
      </fieldset>
      <div class="actions">
        <button id="vote-button" type="submit">Bình chọn</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <section id="poll-results" class="results" aria-labelledby="results-title" hidden>
      <h2 id="results-title">Kết quả bình chọn</h2>
      <p class="thanks">Cảm ơn bạn đã tham gia thăm dò ý kiến.</p>
      <div id="results-list"></div>
      <p id="total" class="total"></p>
      <div class="actions">
        <button id="vote-again" class="button-secondary" type="button">Bình chọn lại</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
    import { collection, doc, getDocs, getFirestore, runTransaction } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyBxFcdkGvAooao_tJB_h9KS-ev2j9AYvts',
      authDomain: 'thegioi-poll.firebaseapp.com',
      projectId: 'thegioi-poll',
      storageBucket: 'thegioi-poll.firebasestorage.app',
      messagingSenderId: '561056553676',
      appId: '1:561056553676:web:381fa041dd41f22cffc069'
    };
    const db = getFirestore(initializeApp(firebaseConfig));
    const POLL_ID = 'ukraine-ballistic-defense-solutions-v1';
    const options = [
      { id: 'patriot-ammunition', label: 'Tăng mạnh nguồn đạn Patriot, đặc biệt PAC-3 MSE' },
      { id: 'layered-air-defense', label: 'Xây mạng phòng không nhiều tầng, kết hợp Patriot, SAMP/T, IRIS-T, NASAMS và drone đánh chặn' },
      { id: 'strike-launch-infrastructure', label: 'Tăng các đòn tập kích vào bệ phóng, kho đạn và cơ sở sản xuất tên lửa của Nga' }
    ];
    const form = document.querySelector('#poll-form');
    const message = document.querySelector('#message');
    const resultsList = document.querySelector('#results-list');
    const totalText = document.querySelector('#total');
    const voteButton = document.querySelector('#vote-button');
    const voteAgainButton = document.querySelector('#vote-again');
    const results = document.querySelector('#poll-results');
    const poll = document.querySelector('.poll');

    function notifyParentHeight() {
      if (window.parent === window) return;
      requestAnimationFrame(() => {
        window.parent.postMessage({
          type: '1thegioi-poll-height',
          height: Math.ceil(poll.getBoundingClientRect().height)
        }, '*');
      });
    }

    new ResizeObserver(notifyParentHeight).observe(poll);
    window.addEventListener('load', notifyParentHeight);

    async function readVotes() {
      const snapshot = await getDocs(collection(db, `polls/${POLL_ID}/options`));
      return options.reduce((votes, option) => {
        votes[option.id] = snapshot.docs.find((item) => item.id === option.id)?.data().votes || 0;
        return votes;
      }, {});
    }

    async function render() {
      const votes = await readVotes();
      const total = Object.values(votes).reduce((sum, value) => sum + value, 0);
      resultsList.replaceChildren(...options.map((option) => {
        const count = votes[option.id];
        const percent = total ? Math.round(count / total * 100) : 0;
        const item = document.createElement('div');
        item.className = 'result';
        item.innerHTML = `<div class="result-head"><span>${option.label}</span><strong>${percent}% (${count})</strong></div><div class="track"><div class="bar" style="width:${percent}%"></div></div>`;
        return item;
      }));
      totalText.textContent = `Tổng số lượt bình chọn: ${total}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const selected = form.elements.answer.value;
      if (!selected) {
        message.textContent = 'Vui lòng chọn một phương án trước khi bình chọn.';
        return;
      }
      voteButton.disabled = true;
      message.textContent = 'Đang ghi nhận bình chọn…';
      try {
        await runTransaction(db, async (transaction) => {
          const optionRef = doc(db, `polls/${POLL_ID}/options`, selected);
          const option = await transaction.get(optionRef);
          if (!option.exists()) {
            transaction.set(optionRef, { label: options.find((item) => item.id === selected).label, votes: 1 });
          } else {
            transaction.update(optionRef, { votes: (option.data().votes || 0) + 1 });
          }
        });
        await render();
        form.hidden = true;
        results.hidden = false;
        notifyParentHeight();
      } catch (error) {
        voteButton.disabled = false;
        message.textContent = 'Chưa ghi nhận được bình chọn. Vui lòng thử lại.';
        console.error(error);
      }
    });

    voteAgainButton.addEventListener('click', () => {
      form.reset();
      message.textContent = '';
      voteButton.disabled = false;
      results.hidden = true;
      form.hidden = false;
      notifyParentHeight();
    });
  </script>
</body>
</html>
